[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmolympic"
version = "0.1.0"
description = "LLM Olympics —— 人类与 LLM 的多项目竞技场"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11.2,<2",
    "pydantic>=2.5",
    "typer>=0.9",
    "rich>=13.0",
    "openai>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
llmolympic = "llmolympic.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["llmolympic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
