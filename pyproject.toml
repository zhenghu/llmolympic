[build-system]
requires = ["hatchling>=1.27,<1.33"]
build-backend = "hatchling.build"

[project]
name = "llmolympic"
dynamic = ["version"]
description = "LLM Olympics —— 人类与 LLM 的多项目竞技场"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11.2,<2",
    "pydantic>=2.5,<3",
    "typer>=0.9,<1",
    "rich>=13.0,<16",
    "openai>=1.0,<4",
    "httpx>=0.27,<1",
    "idna>=3.7,<4",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.0,<10",
    "ruff>=0.4,<1",
]
web = [
    "fastapi>=0.139,<1",
    "uvicorn>=0.51,<1",
    "websockets>=17,<18",
]
security = [
    "pip-audit==2.10.1",
]

[project.scripts]
llmolympic = "llmolympic.cli.main:app"

[tool.hatch.version]
path = "llmolympic/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["llmolympic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_provider: opt-in smoke tests that make real, potentially billable provider calls",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
