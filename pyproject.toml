[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "llmolympic"
version = "0.1.0"
description = "LLM Olympics —— 人类与 LLM 的多项目竞技场"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11.2,<2",
    "pydantic>=2.5,<3",
    "typer>=0.9,<1",
    "rich>=13.0,<16",
    "openai>=1.0,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.4,<1",
]
security = [
    "pip-audit==2.10.1",
]

[project.scripts]
llmolympic = "llmolympic.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["llmolympic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
