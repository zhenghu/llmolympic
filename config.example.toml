# LLM Olympics 配置模板
# 用法：复制到源码项目根目录的 config.toml，或用 LLMOLYMPIC_CONFIG 显式指定路径。
# 程序不会搜索任意当前工作目录中的 config.toml；项目内 config.toml 已被 git 忽略。
# 文件包含密钥时建议设置权限为 0600。
# 取值优先级：环境变量 > config.toml > 默认值。

# OpenAI 及兼容接口（DeepSeek、Kimi、OpenRouter 等都走这里）
[openai]
# api_key = "sk-..."                        # 对应环境变量 OPENAI_API_KEY
# base_url = "https://openrouter.ai/api/v1" # 兼容接口填这里；对应 OPENAI_BASE_URL
# default_model = "openai/gpt-4o-mini"      # 选手写 openai（不带模型名）时用它

# Ollama 本地模型
[ollama]
# base_url = "http://localhost:11434"       # 对应环境变量 OLLAMA_BASE_URL
# default_model = "llama3.1"                # 选手写 ollama（不带模型名）时用它

# 命名 Provider Profiles：同一场可使用多个 OpenAI 兼容端点。
# Profile 只保存 Key 所在的环境变量名，绝不在此填写真实 Key。
# 名称须大写，并以 _API_KEY、_TOKEN、_SECRET 或 _KEY 结尾。
# CLI 写法：profile:<id> 使用 default_model；profile:<id>:<model> 覆盖模型。
[profiles.kimi]
provider = "openai"
default_model = "moonshot-v1-128k"
base_url = "https://api.moonshot.cn/v1"       # 携带 Key 的远程端点必须使用 HTTPS
api_key_env = "KIMI_API_KEY"
display_name = "Kimi"

[profiles.deepseek]
provider = "openai"
default_model = "deepseek-chat"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"
display_name = "DeepSeek"

[profiles.local]
provider = "ollama"
default_model = "llama3.1:8b"
base_url = "http://localhost:11434"
display_name = "Local Llama"

# SQLite 对局档案与 ELO（对应环境变量 LLMOLYMPIC_DB）
[storage]
# database = "~/.llmolympic/llmolympic.db"

# 对局稳定性（对应环境变量 LLMOLYMPIC_LLM_TIMEOUT）
[match]
# llm_timeout_seconds = 120.0

# Provider 调用与费用保护。总预算默认不启用；单次输出上限保持 1024。
# CLI 按字段覆盖环境变量，环境变量再覆盖这里：
# LLMOLYMPIC_MAX_PROVIDER_CALLS / LLMOLYMPIC_MAX_INPUT_TOKENS /
# LLMOLYMPIC_MAX_OUTPUT_TOKENS_PER_CALL / LLMOLYMPIC_MAX_TOTAL_OUTPUT_TOKENS /
# LLMOLYMPIC_MAX_ESTIMATED_COST_USD。
[budget]
# max_provider_calls = 200
# max_input_tokens = 500000
# max_output_tokens_per_call = 1024
# max_total_output_tokens = 200000
# max_estimated_cost_usd = "5.00" # 本地估算上限，不等同 Provider 最终账单

# 云端模型价格必须由用户按精确 CLI spec 显式冻结；程序不会联网猜价。
# 金额使用 USD / 1,000,000 tokens 的十进制字符串。
[pricing."profile:kimi:moonshot-v1-128k"]
input_usd_per_million_tokens = "0.50"
output_usd_per_million_tokens = "2.00"

[pricing."profile:deepseek:deepseek-chat"]
input_usd_per_million_tokens = "0.30"
output_usd_per_million_tokens = "1.20"
