version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # These packages are development-only. React and ReactDOM are also the
  # canonical inputs for the reproducibly built, self-hosted browser bundle.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-development:
        patterns:
          - "*"
        exclude-patterns:
          - "react"
          - "react-dom"
      react-vendor:
        patterns:
          - "react"
          - "react-dom"
