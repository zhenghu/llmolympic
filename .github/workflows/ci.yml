name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          # Runner images can bundle older packaging tools with known CVEs.
          python -m pip install "pip==26.1.2" "setuptools==83.0.0"
          python -m pip install -e ".[dev,security]"

      - name: Audit dependencies
        run: python -m pip_audit

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Validate macOS command files
        run: |
          for script in play.command start_web.command stop_web.command; do
            bash -n "$script"
            test -x "$script"
          done

      - name: Smoke-test CLI registration
        run: python -m llmolympic games

  web:
    name: Read-only Web / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Web extra
        run: |
          python -m pip install "pip==26.1.2" "setuptools==83.0.0"
          python -m pip install -e ".[dev,security,web]"

      - name: Audit dependencies
        run: python -m pip_audit

      - name: Lint
        run: python -m ruff check .

      - name: Test Web slice
        run: python -m pytest -q tests/test_web_*.py

      - name: Execute observer client state machine
        run: |
          node --check llmolympic/web/static/assets/app.js
          node tests/web_client_state.js

      - name: Smoke-test lazy CLI and app factory
        run: |
          python -m llmolympic web --help
          python -c "from llmolympic.web.app import create_app; create_app('missing.db')"

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js for development-only browser checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Verify Web development supply chain
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run build:web
          git diff --exit-code -- llmolympic/web/static/assets/app.js
          npm run verify:web-vendor
          npx --no-install playwright install --with-deps chromium

      - name: Install packaging tools
        run: |
          python -m pip install "pip==26.1.2" "setuptools==83.0.0"
          python -m pip install "build==1.5.0" "twine==6.2.0"

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify MIT license in distributions
        run: python scripts/verify_distribution_license.py dist

      - name: Smoke-test wheel outside the checkout
        run: |
          smoke_venv="${RUNNER_TEMP}/llmolympic-wheel-venv"
          python -m venv "${smoke_venv}"
          "${smoke_venv}/bin/python" -m pip install \
            "pip==26.1.2" "setuptools==83.0.0"
          "${smoke_venv}/bin/python" -m pip install \
            "${GITHUB_WORKSPACE}"/dist/*.whl
          cd "${RUNNER_TEMP}"
          "${smoke_venv}/bin/llmolympic" --version
          "${smoke_venv}/bin/llmolympic" doctor
          "${smoke_venv}/bin/llmolympic" games
          "${smoke_venv}/bin/llmolympic" play \
            --game math_quiz \
            --players mock:fixed,mock:random \
            --rounds 1 \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-wheel-smoke.db"
          "${smoke_venv}/bin/llmolympic" play \
            --game creative_writing \
            --players mock:random,mock:fixed \
            --judge mock:strict \
            --judge mock:balanced \
            --judge mock:lenient \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-wheel-creative-smoke.db"
          "${smoke_venv}/bin/llmolympic" series \
            --game creative_writing \
            --players mock:random,mock:fixed \
            --judge mock:strict \
            --judge mock:balanced \
            --judge mock:lenient \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-wheel-creative-series-smoke.db"
          "${smoke_venv}/bin/llmolympic" round-robin \
            --game creative_writing \
            --players mock:random,mock:fixed,mock:illegal \
            --judge mock:strict \
            --judge mock:balanced \
            --judge mock:lenient \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-wheel-creative-round-robin-smoke.db"

          # The base wheel stays usable without Web dependencies; installing its
          # optional extra must then expose the app factory and lazy CLI command.
          "${smoke_venv}/bin/python" -c \
            "import importlib.util; assert importlib.util.find_spec('fastapi') is None"
          wheel_files=("${GITHUB_WORKSPACE}"/dist/*.whl)
          "${smoke_venv}/bin/python" -m pip install "${wheel_files[0]}[web]"
          cd "${RUNNER_TEMP}"
          "${smoke_venv}/bin/llmolympic" web --help
          "${smoke_venv}/bin/python" -c \
            "from importlib.resources import files; root = files('llmolympic.web').joinpath('static'); assets = root.joinpath('assets'); assert root.joinpath('index.html').is_file(); assert assets.joinpath('app.js').is_file(); assert not assets.joinpath('react.production.min.js').is_file(); assert not assets.joinpath('react-dom.production.min.js').is_file()"
          WEB_SMOKE_DB="${RUNNER_TEMP}/missing-web-smoke.db" \
            "${smoke_venv}/bin/python" -c \
            "import os; from llmolympic.web.app import create_app; create_app(os.environ['WEB_SMOKE_DB'])"
          test ! -e "${RUNNER_TEMP}/missing-web-smoke.db"

      - name: Smoke-test source distribution outside the checkout
        run: |
          smoke_venv="${RUNNER_TEMP}/llmolympic-sdist-venv"
          python -m venv "${smoke_venv}"
          "${smoke_venv}/bin/python" -m pip install \
            "pip==26.1.2" "setuptools==83.0.0"
          "${smoke_venv}/bin/python" -m pip install \
            "${GITHUB_WORKSPACE}"/dist/*.tar.gz
          cd "${RUNNER_TEMP}"
          "${smoke_venv}/bin/llmolympic" --version
          "${smoke_venv}/bin/llmolympic" doctor
          "${smoke_venv}/bin/llmolympic" games
          "${smoke_venv}/bin/llmolympic" play \
            --game math_quiz \
            --players mock:fixed,mock:random \
            --rounds 1 \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-sdist-smoke.db"
          "${smoke_venv}/bin/llmolympic" play \
            --game creative_writing \
            --players mock:random,mock:fixed \
            --judge mock:strict \
            --judge mock:balanced \
            --judge mock:lenient \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-sdist-creative-smoke.db"
          "${smoke_venv}/bin/llmolympic" series \
            --game creative_writing \
            --players mock:random,mock:fixed \
            --judge mock:strict \
            --judge mock:balanced \
            --judge mock:lenient \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-sdist-creative-series-smoke.db"
          "${smoke_venv}/bin/llmolympic" round-robin \
            --game creative_writing \
            --players mock:random,mock:fixed,mock:illegal \
            --judge mock:strict \
            --judge mock:balanced \
            --judge mock:lenient \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-sdist-creative-round-robin-smoke.db"

          # The sdist must build a wheel containing the same self-hosted observer UI.
          "${smoke_venv}/bin/python" -c \
            "import importlib.util; assert importlib.util.find_spec('fastapi') is None"
          sdist_files=("${GITHUB_WORKSPACE}"/dist/*.tar.gz)
          "${smoke_venv}/bin/python" -m pip install "${sdist_files[0]}[web]"
          cd "${RUNNER_TEMP}"
          "${smoke_venv}/bin/llmolympic" web --help
          "${smoke_venv}/bin/python" -c \
            "from importlib.resources import files; root = files('llmolympic.web').joinpath('static'); assets = root.joinpath('assets'); assert root.joinpath('index.html').is_file(); assert assets.joinpath('app.js').is_file(); assert not assets.joinpath('react.production.min.js').is_file(); assert not assets.joinpath('react-dom.production.min.js').is_file()"
          WEB_SMOKE_DB="${RUNNER_TEMP}/missing-sdist-web-smoke.db" \
            "${smoke_venv}/bin/python" -c \
            "import os; from llmolympic.web.app import create_app; create_app(os.environ['WEB_SMOKE_DB'])"
          test ! -e "${RUNNER_TEMP}/missing-sdist-web-smoke.db"

      - name: Browser and axe smoke-test the installed wheel
        shell: bash
        run: |
          smoke_venv="${RUNNER_TEMP}/llmolympic-wheel-venv"
          e2e_root="${RUNNER_TEMP}/llmolympic-web-e2e"
          mkdir -p "${e2e_root}"
          cd "${RUNNER_TEMP}"
          "${smoke_venv}/bin/python" \
            "${GITHUB_WORKSPACE}/tests/web_e2e/create_fixture.py" \
            "${e2e_root}/observer.db"
          "${smoke_venv}/bin/llmolympic" web \
            --db "${e2e_root}/observer.db" \
            --host 127.0.0.1 \
            --port 8765 \
            >"${e2e_root}/server.log" 2>&1 &
          web_pid="$!"
          cleanup() {
            kill "${web_pid}" >/dev/null 2>&1 || true
            wait "${web_pid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=false
          for _ in {1..40}; do
            if curl --fail --silent --max-time 1 \
              http://127.0.0.1:8765/api/v1/health >/dev/null; then
              ready=true
              break
            fi
            sleep 0.25
          done
          if [[ "${ready}" != "true" ]]; then
            cat "${e2e_root}/server.log" >&2
            exit 1
          fi
          cd "${GITHUB_WORKSPACE}"
          LLMOLYMPIC_WEB_E2E_URL=http://127.0.0.1:8765 npm run test:web-e2e
