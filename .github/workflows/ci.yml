name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          # Runner images can bundle older packaging tools with known CVEs.
          python -m pip install "pip==26.1.2" "setuptools==83.0.0"
          python -m pip install -e ".[dev,security]"

      - name: Audit dependencies
        run: python -m pip_audit

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Validate macOS launcher syntax
        run: bash -n play.command

      - name: Smoke-test CLI registration
        run: python -m llmolympic games

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install packaging tools
        run: |
          python -m pip install "pip==26.1.2" "setuptools==83.0.0"
          python -m pip install "build==1.5.0" "twine==6.2.0"

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify MIT license in distributions
        run: python scripts/verify_distribution_license.py dist

      - name: Smoke-test wheel outside the checkout
        run: |
          smoke_venv="${RUNNER_TEMP}/llmolympic-wheel-venv"
          python -m venv "${smoke_venv}"
          "${smoke_venv}/bin/python" -m pip install \
            "pip==26.1.2" "setuptools==83.0.0"
          "${smoke_venv}/bin/python" -m pip install \
            "${GITHUB_WORKSPACE}"/dist/*.whl
          cd "${RUNNER_TEMP}"
          "${smoke_venv}/bin/llmolympic" --version
          "${smoke_venv}/bin/llmolympic" doctor
          "${smoke_venv}/bin/llmolympic" games
          "${smoke_venv}/bin/llmolympic" play \
            --game math_quiz \
            --players mock:fixed,mock:random \
            --rounds 1 \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-wheel-smoke.db"
