name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match v + package version)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js for development-only browser checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${REQUESTED_TAG}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use the exact vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Verify version and main commit
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          checkout_commit="$(git rev-parse HEAD^{commit})"
          main_commit="$(git rev-parse origin/main^{commit})"
          if [[ "${checkout_commit}" != "${main_commit}" ]]; then
            echo "Release checkout must be the current origin/main commit." >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]]; then
              echo "Tag ${RELEASE_TAG} must be an annotated tag." >&2
              exit 1
            fi
            tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            if [[ "${tag_commit}" != "${main_commit}" ]]; then
              echo "Tag ${RELEASE_TAG} must point to the current origin/main commit." >&2
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin \
            "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin \
              "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]]; then
              echo "Existing tag ${RELEASE_TAG} is not annotated." >&2
              exit 1
            fi
            tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            if [[ "${tag_commit}" != "${main_commit}" ]]; then
              echo "Existing tag ${RELEASE_TAG} does not point to origin/main." >&2
              exit 1
            fi
          fi

          package_version="$(python -c 'from llmolympic import __version__; print(__version__)')"
          if [[ "${RELEASE_TAG}" != "v${package_version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${package_version}." >&2
            exit 1
          fi

      - name: Install project and release tools
        run: |
          python -m pip install "pip==26.1.2" "setuptools==83.0.0"
          python -m pip install -e ".[dev,security,web]"
          python -m pip install "build==1.5.0" "twine==6.2.0"

      - name: Verify Web development supply chain
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run verify:web-vendor
          npx --no-install playwright install --with-deps chromium

      - name: Audit dependencies
        run: python -m pip_audit

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify MIT license in distributions
        run: python scripts/verify_distribution_license.py dist

      - name: Smoke-test wheel outside the checkout
        run: |
          smoke_venv="${RUNNER_TEMP}/llmolympic-wheel-venv"
          python -m venv "${smoke_venv}"
          "${smoke_venv}/bin/python" -m pip install \
            "pip==26.1.2" "setuptools==83.0.0"
          "${smoke_venv}/bin/python" -m pip install \
            "${GITHUB_WORKSPACE}"/dist/*.whl
          cd "${RUNNER_TEMP}"
          "${smoke_venv}/bin/llmolympic" --version
          "${smoke_venv}/bin/llmolympic" doctor
          "${smoke_venv}/bin/llmolympic" games
          "${smoke_venv}/bin/llmolympic" play \
            --game math_quiz \
            --players mock:fixed,mock:random \
            --rounds 1 \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-wheel-smoke.db"
          "${smoke_venv}/bin/llmolympic" play \
            --game creative_writing \
            --players mock:random,mock:fixed \
            --judge mock:strict \
            --judge mock:balanced \
            --judge mock:lenient \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-wheel-creative-smoke.db"
          "${smoke_venv}/bin/llmolympic" series \
            --game creative_writing \
            --players mock:random,mock:fixed \
            --judge mock:strict \
            --judge mock:balanced \
            --judge mock:lenient \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-wheel-creative-series-smoke.db"
          "${smoke_venv}/bin/llmolympic" round-robin \
            --game creative_writing \
            --players mock:random,mock:fixed,mock:illegal \
            --judge mock:strict \
            --judge mock:balanced \
            --judge mock:lenient \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-wheel-creative-round-robin-smoke.db"

          wheel_files=("${GITHUB_WORKSPACE}"/dist/*.whl)
          "${smoke_venv}/bin/python" -m pip install "${wheel_files[0]}[web]"
          cd "${RUNNER_TEMP}"
          "${smoke_venv}/bin/llmolympic" web --help
          "${smoke_venv}/bin/python" -c \
            "from importlib.resources import files; root = files('llmolympic.web').joinpath('static'); assert root.joinpath('index.html').is_file(); assert root.joinpath('assets', 'app.js').is_file(); assert root.joinpath('assets', 'react-dom.production.min.js').is_file()"

      - name: Smoke-test source distribution outside the checkout
        run: |
          smoke_venv="${RUNNER_TEMP}/llmolympic-sdist-venv"
          python -m venv "${smoke_venv}"
          "${smoke_venv}/bin/python" -m pip install \
            "pip==26.1.2" "setuptools==83.0.0"
          "${smoke_venv}/bin/python" -m pip install \
            "${GITHUB_WORKSPACE}"/dist/*.tar.gz
          cd "${RUNNER_TEMP}"
          "${smoke_venv}/bin/llmolympic" --version
          "${smoke_venv}/bin/llmolympic" doctor
          "${smoke_venv}/bin/llmolympic" games
          "${smoke_venv}/bin/llmolympic" play \
            --game math_quiz \
            --players mock:fixed,mock:random \
            --rounds 1 \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-sdist-smoke.db"
          "${smoke_venv}/bin/llmolympic" play \
            --game creative_writing \
            --players mock:random,mock:fixed \
            --judge mock:strict \
            --judge mock:balanced \
            --judge mock:lenient \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-sdist-creative-smoke.db"
          "${smoke_venv}/bin/llmolympic" series \
            --game creative_writing \
            --players mock:random,mock:fixed \
            --judge mock:strict \
            --judge mock:balanced \
            --judge mock:lenient \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-sdist-creative-series-smoke.db"
          "${smoke_venv}/bin/llmolympic" round-robin \
            --game creative_writing \
            --players mock:random,mock:fixed,mock:illegal \
            --judge mock:strict \
            --judge mock:balanced \
            --judge mock:lenient \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-sdist-creative-round-robin-smoke.db"

          sdist_files=("${GITHUB_WORKSPACE}"/dist/*.tar.gz)
          "${smoke_venv}/bin/python" -m pip install "${sdist_files[0]}[web]"
          cd "${RUNNER_TEMP}"
          "${smoke_venv}/bin/llmolympic" web --help
          "${smoke_venv}/bin/python" -c \
            "from importlib.resources import files; root = files('llmolympic.web').joinpath('static'); assert root.joinpath('index.html').is_file(); assert root.joinpath('assets', 'app.js').is_file(); assert root.joinpath('assets', 'react-dom.production.min.js').is_file()"

      - name: Browser and axe smoke-test the installed wheel
        shell: bash
        run: |
          smoke_venv="${RUNNER_TEMP}/llmolympic-wheel-venv"
          e2e_root="${RUNNER_TEMP}/llmolympic-web-e2e"
          mkdir -p "${e2e_root}"
          cd "${RUNNER_TEMP}"
          "${smoke_venv}/bin/python" \
            "${GITHUB_WORKSPACE}/tests/web_e2e/create_fixture.py" \
            "${e2e_root}/observer.db"
          "${smoke_venv}/bin/llmolympic" web \
            --db "${e2e_root}/observer.db" \
            --host 127.0.0.1 \
            --port 8765 \
            >"${e2e_root}/server.log" 2>&1 &
          web_pid="$!"
          cleanup() {
            kill "${web_pid}" >/dev/null 2>&1 || true
            wait "${web_pid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=false
          for _ in {1..40}; do
            if curl --fail --silent --max-time 1 \
              http://127.0.0.1:8765/api/v1/health >/dev/null; then
              ready=true
              break
            fi
            sleep 0.25
          done
          if [[ "${ready}" != "true" ]]; then
            cat "${e2e_root}/server.log" >&2
            exit 1
          fi
          cd "${GITHUB_WORKSPACE}"
          LLMOLYMPIC_WEB_E2E_URL=http://127.0.0.1:8765 npm run test:web-e2e

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Final revalidation
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          checkout_commit="$(git rev-parse HEAD^{commit})"
          main_commit="$(git rev-parse origin/main^{commit})"
          if [[ "${checkout_commit}" != "${main_commit}" ]]; then
            echo "origin/main moved while preparing ${RELEASE_TAG}; refusing to tag." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin \
            "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin \
              "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]]; then
              echo "Tag ${RELEASE_TAG} must be an annotated tag." >&2
              exit 1
            fi
            tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            if [[ "${tag_commit}" != "${main_commit}" ]]; then
              echo "Tag ${RELEASE_TAG} must point to the current origin/main commit." >&2
              exit 1
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "Tag ${RELEASE_TAG} disappeared during release preparation." >&2
            exit 1
          fi

      - name: Create or verify annotated tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          checkout_commit="$(git rev-parse HEAD^{commit})"
          main_commit="$(git rev-parse origin/main^{commit})"
          if [[ "${checkout_commit}" != "${main_commit}" ]]; then
            echo "origin/main moved while preparing ${RELEASE_TAG}; refusing to tag." >&2
            exit 1
          fi

          if ! git ls-remote --exit-code --tags origin \
            "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            tag_sha="$(gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="${RELEASE_TAG}" \
              -f message="LLM Olympics ${RELEASE_TAG}" \
              -f object="${main_commit}" \
              -f type="commit" \
              -f 'tagger[name]=github-actions[bot]' \
              -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' \
              -f "tagger[date]=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --jq '.sha')"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${tag_sha}" >/dev/null
          fi

          git fetch --force origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]]; then
            echo "Tag ${RELEASE_TAG} must be an annotated tag." >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "${tag_commit}" != "${main_commit}" ]]; then
            echo "Tag ${RELEASE_TAG} must point to the current origin/main commit." >&2
            exit 1
          fi

      - name: Create or refresh draft GitHub Release
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if release_json="$(gh release view "${RELEASE_TAG}" \
            --json isDraft,isPrerelease,assets 2>/dev/null)"; then
            if [[ "$(jq -r '.isPrerelease' <<<"${release_json}")" == "true" ]]; then
              echo "Existing release ${RELEASE_TAG} is unexpectedly a prerelease." >&2
              exit 1
            fi
            if [[ "$(jq -r '.isDraft' <<<"${release_json}")" == "true" ]]; then
              gh release edit "${RELEASE_TAG}" \
                --title "LLM Olympics ${RELEASE_TAG}" \
                --prerelease=false
              gh release upload "${RELEASE_TAG}" \
                dist/*.whl dist/*.tar.gz dist/SHA256SUMS --clobber
              echo "already_published=false" >> "${GITHUB_OUTPUT}"
            else
              verify_dir="${RUNNER_TEMP}/existing-release"
              mkdir -p "${verify_dir}"
              gh release download "${RELEASE_TAG}" \
                --dir "${verify_dir}" \
                --pattern "llmolympic-${RELEASE_TAG#v}-py3-none-any.whl" \
                --pattern "llmolympic-${RELEASE_TAG#v}.tar.gz" \
                --pattern "SHA256SUMS"
              for asset in \
                "llmolympic-${RELEASE_TAG#v}-py3-none-any.whl" \
                "llmolympic-${RELEASE_TAG#v}.tar.gz" \
                "SHA256SUMS"; do
                if ! cmp -s "dist/${asset}" "${verify_dir}/${asset}"; then
                  echo "Published release ${RELEASE_TAG} has mismatched ${asset}." >&2
                  exit 1
                fi
              done
              echo "already_published=true" >> "${GITHUB_OUTPUT}"
            fi
          else
            gh release create "${RELEASE_TAG}" \
              dist/*.whl \
              dist/*.tar.gz \
              dist/SHA256SUMS \
              --verify-tag \
              --title "LLM Olympics ${RELEASE_TAG}" \
              --generate-notes \
              --draft
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish GitHub Release
        if: steps.release_state.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "${RELEASE_TAG}" --draft=false
