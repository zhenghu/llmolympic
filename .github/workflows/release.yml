name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify tag and main commit
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use the exact vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          main_commit="$(git rev-parse origin/main^{commit})"
          if [[ "${tag_commit}" != "${main_commit}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} must point to the current origin/main commit." >&2
            exit 1
          fi

          package_version="$(python -c 'from llmolympic import __version__; print(__version__)')"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi

      - name: Install project and release tools
        run: |
          python -m pip install "pip==26.1.2" "setuptools==83.0.0"
          python -m pip install -e ".[dev,security]"
          python -m pip install "build==1.5.0" "twine==6.2.0"

      - name: Audit dependencies
        run: python -m pip_audit

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify MIT license in distributions
        run: python scripts/verify_distribution_license.py dist

      - name: Smoke-test wheel outside the checkout
        run: |
          smoke_venv="${RUNNER_TEMP}/llmolympic-wheel-venv"
          python -m venv "${smoke_venv}"
          "${smoke_venv}/bin/python" -m pip install \
            "pip==26.1.2" "setuptools==83.0.0"
          "${smoke_venv}/bin/python" -m pip install \
            "${GITHUB_WORKSPACE}"/dist/*.whl
          cd "${RUNNER_TEMP}"
          "${smoke_venv}/bin/llmolympic" --version
          "${smoke_venv}/bin/llmolympic" doctor
          "${smoke_venv}/bin/llmolympic" games
          "${smoke_venv}/bin/llmolympic" play \
            --game math_quiz \
            --players mock:fixed,mock:random \
            --rounds 1 \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-wheel-smoke.db"

      - name: Smoke-test source distribution outside the checkout
        run: |
          smoke_venv="${RUNNER_TEMP}/llmolympic-sdist-venv"
          python -m venv "${smoke_venv}"
          "${smoke_venv}/bin/python" -m pip install \
            "pip==26.1.2" "setuptools==83.0.0"
          "${smoke_venv}/bin/python" -m pip install \
            "${GITHUB_WORKSPACE}"/dist/*.tar.gz
          cd "${RUNNER_TEMP}"
          "${smoke_venv}/bin/llmolympic" --version
          "${smoke_venv}/bin/llmolympic" doctor
          "${smoke_venv}/bin/llmolympic" games
          "${smoke_venv}/bin/llmolympic" play \
            --game math_quiz \
            --players mock:fixed,mock:random \
            --rounds 1 \
            --seed 42 \
            --db "${RUNNER_TEMP}/llmolympic-sdist-smoke.db"

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --title "LLM Olympics ${GITHUB_REF_NAME}" \
            --generate-notes \
            --draft

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
